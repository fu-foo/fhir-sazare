# fhir-sazare Server Configuration Example
# Copy this file to config.yaml and customize as needed

server:
  # 127.0.0.1 (default) = this machine only. Use "0.0.0.0" to accept
  # connections from the network — only together with auth.enabled: true.
  host: "127.0.0.1"
  port: 8080
  # Maximum request body size in MiB (transaction Bundles, $import NDJSON).
  # Larger requests are rejected with 413.
  max_request_mb: 64

auth:
  # Set enabled to true to require authentication
  enabled: false

  # API keys for Bearer token authentication. Generate one with
  #   sazare-server auth new-api-key my-app
  # (prints the key once, and the lines below with its SHA-256).
  # api_keys:
  #   - name: "my-app"
  #     key_sha256: "<64 hex digits>"

  # Basic authentication users (the dashboard logs in with these). Generate with
  #   sazare-server auth hash-password admin
  # basic_auth:
  #   - username: "admin"
  #     password_hash: "$argon2id$..."

storage:
  # Relative paths in this file are relative to the file itself.
  data_dir: "data"
  resources_db: "resources.sqlite"
  search_index_db: "search_index.sqlite"
  audit_db: "audit.sqlite"

log:
  # Log level: trace, debug, info, warn, error
  level: "info"

# subscription:
#   # Allow rest-hook endpoints on loopback/private/link-local addresses
#   # (localhost, 10.x, 192.168.x, 169.254.x, ...). Off by default when auth is
#   # enabled; always allowed when auth is disabled (local development).
#   allow_private_endpoints: false

# validation:
#   # Validate resources that declare no meta.profile against a default profile
#   # per resource type. The profile must be loaded (embedded US Core, or a
#   # file in profiles/); an unknown URL stops the server at startup.
#   default_profiles:
#     Patient: "http://jpfhir.jp/fhir/core/StructureDefinition/JP_Patient"
#   # enforce (default): reject non-conforming resources.
#   # warn: accept them; violations appear in $validate and the server log.
#   default_profile_mode: enforce

webhook:
  enabled: false
  endpoints:
    - url: "https://example.com/webhook"
      events:
        - "BundleCreated"
        - "TaskCompleted"
      headers:
        Authorization: "Bearer your-webhook-secret"
        Content-Type: "application/json"
