services:
  sazare:
    image: ghcr.io/fu-foo/fhir-sazare:latest
    # To build locally instead: comment out 'image' and uncomment 'build'
    # build: .
    ports:
      - "8080:8080"
    # A stop lets requests in flight finish for up to 30 s; Docker's default
    # 10 s would cut them (and the index's last sync point) short.
    stop_grace_period: 45s
    volumes:
      - sazare-data:/data
      # Your own configuration (the image has a default one): create
      # config.yaml next to this file first — `cp config.example.yaml
      # config.yaml` — or Docker mounts an empty directory there.
      # - ./config.yaml:/etc/sazare/config.yaml:ro
    environment:
      - SAZARE_DATA_DIR=/data
      - RUST_LOG=info
    # Docker keeps a container's output without limit by default.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "2"

volumes:
  sazare-data:
