name: exp-libc
on:
  pull_request:
    branches: [main]
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,x86_64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: pip install ziglang && cargo install cargo-zigbuild --locked
      - run: cargo build --release
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.28
      - run: |
          for b in target/release/sazare-server target/x86_64-unknown-linux-musl/release/sazare-server target/x86_64-unknown-linux-gnu/release/sazare-server; do
            file $b; objdump -T $b 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1
          done
      - run: |
          for round in 1 2; do
            for b in target/release/sazare-server target/x86_64-unknown-linux-musl/release/sazare-server target/x86_64-unknown-linux-gnu/release/sazare-server; do
              echo "### $b (round $round)" | tee -a "$GITHUB_STEP_SUMMARY"
              SAZARE_BIN=$b bench/run.sh 10000 5 | grep -E 'Import|category|_has|gender=female&birth|code=8867-4&date' | tee -a "$GITHUB_STEP_SUMMARY"
            done
          done
