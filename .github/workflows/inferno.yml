name: Inferno US Core

# Runs the Inferno US Core Test Kit against a freshly seeded sazare server.
# Slow (Inferno + HL7 validator containers), so it runs on PRs/main and on demand.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  us-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The TLS test needs an HTTPS deployment; sazare is served over plain HTTP here.
      INFERNO_DISABLE_TLS_TEST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

      - name: Start sazare and load the US Core v8 seed
        run: |
          mkdir -p "$RUNNER_TEMP/sazare"
          cat > "$RUNNER_TEMP/sazare/config.yaml" <<YAML
          server:
            host: "0.0.0.0"
            port: 18080
          auth:
            enabled: false
          storage:
            data_dir: "$RUNNER_TEMP/sazare/data"
          YAML
          nohup target/release/sazare-server --config "$RUNNER_TEMP/sazare/config.yaml" \
            > "$RUNNER_TEMP/sazare/server.log" 2>&1 &
          for _ in $(seq 100); do curl -sf http://localhost:18080/health && break; sleep 0.2; done
          SAZARE_URL=http://localhost:18080 bash examples/10_us_core_v8_seed.sh | tail -5

      - name: Fetch US Core Test Kit
        run: git clone --depth 1 https://github.com/inferno-framework/us-core-test-kit.git "$RUNNER_TEMP/us-core-test-kit"

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: ${{ runner.temp }}/us-core-test-kit
          # The kit's .ruby-version pins a patch release that newer runner
          # images don't ship; any 3.3.x works.
          ruby-version: "3.3"
          bundler-cache: true

      - name: Start Inferno services
        working-directory: ${{ runner.temp }}/us-core-test-kit
        run: |
          bundle exec inferno migrate
          bundle exec inferno services start
          for _ in $(seq 120); do
            curl -sf http://localhost/hl7validatorapi/validator/version && break; sleep 5
          done

      # With smart_app_launch_version pinned, the suite has exactly one SMART
      # App Launch group (1, needs a browser — not runnable from the CLI) and
      # then the US Core FHIR API group (2), which is what this job runs.
      - name: Run us_core_v800 (US Core FHIR API group)
        working-directory: ${{ runner.temp }}/us-core-test-kit
        run: |
          status=0
          bundle exec inferno execute --suite us_core_v800 \
            --suite-options smart_app_launch_version:smart_app_launch_2 --groups 2 \
            --inputs url:http://localhost:18080 patient_ids:patient-example \
              'smart_auth_info:{"access_token":"unused-auth-disabled"}' \
            > "$RUNNER_TEMP/inferno.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/inferno.txt"
          {
            echo '### Inferno us_core_v800 — US Core FHIR API'
            echo '```'
            grep -vE '^(W|I), \[|warning:' "$RUNNER_TEMP/inferno.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Guard against group renumbering silently testing the wrong group.
          if ! grep -q '^2 US Core FHIR API' "$RUNNER_TEMP/inferno.txt"; then
            echo "::error::group 2 is not 'US Core FHIR API' — check the suite's group order"
            exit 1
          fi
          exit $status

      - name: Server log
        if: always()
        run: tail -100 "$RUNNER_TEMP/sazare/server.log" || true
