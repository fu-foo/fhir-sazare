name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # Static (musl): runs on any Linux, whatever its glibc (RHEL 8,
          # Ubuntu 20.04, …). Each built on its own architecture.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: sazare-server-linux-amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            artifact: sazare-server-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: sazare-server-macos-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: sazare-server-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: sazare-server-windows-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl's C compiler wrapper, for the bundled SQLite.
      - name: Install musl tools
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Check the Linux binary is static
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          bin=target/${{ matrix.target }}/release/sazare-server
          file "$bin"
          file "$bin" | grep -q "statically linked"
          "$bin" version

      # Package binary
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz sazare-server
          cd ../../..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.artifact }}.zip sazare-server.exe
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # One file listing every archive's SHA-256, for `sha256sum -c`.
      - name: Checksums
        run: |
          mkdir dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} dist/ \;
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
