name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # glibc 2.28 or newer (RHEL 8, Ubuntu 20.04, Debian 10, …), built
          # with zig as the linker against that glibc. Not musl: its memcpy
          # and allocator make the bundled SQLite ~1.7x slower on large
          # counts (measured).
          - target: x86_64-unknown-linux-gnu
            glibc: "2.28"
            os: ubuntu-latest
            artifact: sazare-server-linux-amd64
          - target: aarch64-unknown-linux-gnu
            glibc: "2.28"
            os: ubuntu-latest
            artifact: sazare-server-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: sazare-server-macos-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: sazare-server-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: sazare-server-windows-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.glibc
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked

      - name: Build
        if: ${{ !matrix.glibc }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (against glibc ${{ matrix.glibc }})
        if: matrix.glibc
        run: cargo zigbuild --release --target ${{ matrix.target }}.${{ matrix.glibc }}

      - name: Check the glibc it needs
        if: matrix.glibc
        run: |
          bin=target/${{ matrix.target }}/release/sazare-server
          need=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "needs glibc $need"
          [ "$(printf '%s\n%s\n' "$need" "${{ matrix.glibc }}" | sort -V | tail -1)" = "${{ matrix.glibc }}" ]

      # Package binary
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz sazare-server
          cd ../../..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.artifact }}.zip sazare-server.exe
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # One file listing every archive's SHA-256, for `sha256sum -c`.
      - name: Checksums
        run: |
          mkdir dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} dist/ \;
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
