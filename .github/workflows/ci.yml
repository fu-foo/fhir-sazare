name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all
      - run: cargo clippy --all --all-targets -- -D warnings

  # Search benchmark on a 60k-resource synthetic dataset. Timings vary between
  # runners, so the gate is deliberately loose (500ms per query): it exists to
  # catch algorithmic regressions (full scans, O(n*m) joins), which show up as
  # seconds, not as small drifts. The table is published to the job summary.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Search benchmark
        run: MAX_MS=500 bench/run.sh 10000 5 | tee -a "$GITHUB_STEP_SUMMARY"

  # An implementation guide end to end, with JP Core: fetch the package and its
  # terminology with the generic IG script, start sazare on them, load the
  # package's 76 examples, and check every JP Core search parameter plus profile
  # and code-system validation (ci/jp_core_check.sh).
  jp-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Fetch JP Core and its terminology
        run: |
          bash examples/ig/setup.sh --dir "$RUNNER_TEMP/jp" --terminology \
            https://jpfhir.jp/fhir/core/1.2.0/package.tgz \
            --terminology-package https://jpfhir.jp/fhir/core/terminology/jpfhir-terminology.r4-2.2611.0.tgz
      - name: Start sazare on JP Core
        working-directory: ${{ runner.temp }}/jp
        run: |
          printf 'server:\n  port: 18080\nstorage:\n  data_dir: "data"\n' > config.yaml
          "$GITHUB_WORKSPACE/target/release/sazare-server" start --config config.yaml
          grep -E 'custom profiles|SearchParameter|Terminology|Skipping' data/logs/sazare.log
      - name: Load the examples
        run: SAZARE_URL=http://localhost:18080 bash examples/ig/load_examples.sh "$RUNNER_TEMP/jp"
      - name: Check JP Core searches and validation
        run: SAZARE_URL=http://localhost:18080 bash ci/jp_core_check.sh "$RUNNER_TEMP/jp"
      - name: Server log
        if: always()
        run: tail -50 "$RUNNER_TEMP/jp/data/logs/sazare.log" || true

  # Backup → restore round trip as documented: online --backup, restore only
  # resources + audit, let the index and full text rebuild, compare searches.
  backup-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: bash ci/backup_roundtrip.sh

  # Upgrade path: a data dir written by the last release opened by this
  # build — searches answered by the old index while the new one builds, then
  # by the new one, must match the old release's.
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.16.0 -p sazare-server-linux-amd64.tar.gz -D "$RUNNER_TEMP/old"
          tar -xzf "$RUNNER_TEMP/old/sazare-server-linux-amd64.tar.gz" -C "$RUNNER_TEMP/old"
          find "$RUNNER_TEMP/old" -name sazare-server -type f
      - run: python3 ci/upgrade_check.py "$(find "$RUNNER_TEMP/old" -name sazare-server -type f | head -1)" target/release/sazare-server 2000

  # The image runs as an unprivileged user. Upgrade path: a data volume written
  # by an older (root) image must keep working without manual steps.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sazare:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Root-owned volume from an older image → non-root server
        run: |
          set -eux
          docker volume create olddata
          # What a pre-0.13 image left behind: root-owned files.
          docker run --rm -v olddata:/data alpine sh -c 'touch /data/resources.sqlite && chown -R 0:0 /data'
          docker run -d --name sazare -p 8080:8080 -v olddata:/data sazare:ci
          for i in $(seq 60); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf localhost:8080/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT localhost:8080/Patient/p1 \
            -H 'Content-Type: application/fhir+json' -d '{"resourceType":"Patient","id":"p1"}')" = 201
          # The server process is not root, and the data is its.
          test "$(docker exec sazare ps -o user= -o comm= | awk '$2=="sazare-server"{print $1}')" = sazare
          test "$(docker exec sazare stat -c %U /data/resources.sqlite)" = sazare
          # The bundled sample app is served.
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/apps/sample-patient-register/)" = 200
          docker restart sazare
          for i in $(seq 60); do curl -sf localhost:8080/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/Patient/p1)" = 200
      - name: Server log
        if: always()
        run: docker logs sazare || true

  # start / stop on Windows: the instance lock (exclusive open) and the detached
  # child (DETACHED_PROCESS) are Windows-specific code paths.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin sazare-server
      - name: start, status, second server refused, stop
        shell: pwsh
        run: |
          $b = "target\release\sazare-server.exe"
          New-Item -ItemType Directory -Force w | Out-Null
          "server:`n  port: 18080`nstorage:`n  data_dir: `"w/data`"" | Set-Content w\c.yaml
          & $b start --config w\c.yaml; if ($LASTEXITCODE -ne 0) { throw "start failed" }
          if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18080/health).StatusCode -ne 200) { throw "health" }
          & $b status --config w\c.yaml; if ($LASTEXITCODE -ne 0) { throw "status should be 0" }
          & $b run --config w\c.yaml; if ($LASTEXITCODE -ne 1) { throw "a second server must be refused" }
          & $b stop --config w\c.yaml; if ($LASTEXITCODE -ne 0) { throw "stop failed" }
          & $b status --config w\c.yaml; if ($LASTEXITCODE -ne 3) { throw "status should be 3 after stop" }
          & $b start --config w\c.yaml; if ($LASTEXITCODE -ne 0) { throw "restart failed" }
          & $b stop --config w\c.yaml; if ($LASTEXITCODE -ne 0) { throw "second stop failed" }
      - name: Server log
        if: always()
        shell: pwsh
        run: Get-Content w\data\logs\sazare.log -ErrorAction SilentlyContinue
