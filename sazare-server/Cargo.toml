[package]
name = "sazare-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "sazare_server"
path = "src/lib.rs"

[[bin]]
name = "sazare-server"
path = "src/main.rs"

[dependencies]
sazare-core = { path = "../sazare-core" }
sazare-store = { path = "../sazare-store" }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = { version = "0.8", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "fs", "catch-panic"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
argon2 = { version = "0.5", features = ["std", "rand"] }
sha2 = "0.10"
rpassword = "7"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
json-patch = "4"
futures-util = "0.3"
jsonwebtoken = "9"
http-body-util = "0.1.3"
tokio-rustls = { version = "0.26", features = ["ring"] }
rustls-pemfile = "2"
serde_urlencoded = "0.7.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# musl's allocator is slow under concurrent load: the static Linux builds
# (release binaries, Docker image) use mimalloc.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.24"
rusqlite = { version = "0.35", features = ["bundled"] }
